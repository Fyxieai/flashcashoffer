<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Offer Quiz - Embed Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        
        .popup-container {
            position: relative;
            width: 90%;
            max-width: 500px;
            height: 90%;
            max-height: 700px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .quiz-iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }
        
        .trigger-btn {
            background: linear-gradient(135deg, #F6BC3E, #f59e0b);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(246, 188, 62, 0.3);
            transition: all 0.3s ease;
        }
        
        .trigger-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(246, 188, 62, 0.4);
        }
        
        .demo-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="demo-content">
        <h1>Your Website Content</h1>
        <p>This is an example of how the cash offer quiz popup would work on your website. Click the button below to see the quiz in action.</p>
        
        <button class="trigger-btn" onclick="openQuizPopup()">
            Get Your Cash Offer Now! ⚡
        </button>
        
        <p style="margin-top: 40px; font-size: 14px; color: #888;">
            Replace "YOUR_DOMAIN" in the iframe src with your actual deployed domain (e.g., cashoffer.fyxie.ai)
        </p>
    </div>

    <!-- Popup Overlay -->
    <div class="popup-overlay" id="quizPopup">
        <div class="popup-container">
            <button class="close-btn" onclick="closeQuizPopup()">&times;</button>
            <iframe 
                class="quiz-iframe" 
                src="https://YOUR_DOMAIN/popup"
                title="Cash Offer Quiz"
                loading="lazy">
            </iframe>
        </div>
    </div>

    <script>
        function openQuizPopup() {
            document.getElementById('quizPopup').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }
        
        function closeQuizPopup() {
            document.getElementById('quizPopup').style.display = 'none';
            document.body.style.overflow = 'auto'; // Restore scrolling
        }
        
        // Close popup when clicking outside
        document.getElementById('quizPopup').addEventListener('click', function(e) {
            if (e.target === this) {
                closeQuizPopup();
            }
        });
        
        // Close popup with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeQuizPopup();
            }
        });
    </script>
</body>
</html>
